listening_port: 6502

# Maximum number of clients that may be connected at once. Extra connection
# attempts beyond this are rejected immediately. Optional, defaults to 100.
max_connections: 100

# Seconds a connected client has to pick a menu option before being
# disconnected. Optional, defaults to 120.
choice_timeout: 120

# A link to a page designed in the ZXNet or edit.tf editor. Only the top
# `banner_rows` rows are used - design it as a logo/header, and leave the
# rest of the page blank, since the backend list below it is auto-generated.
banner_url: https://zxnet.co.uk/teletext/editor/#0:-7phx9EHbTl75MPTDAx9emXYu3ZeiBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQIECA:PS=0:RE=0:zx=FA00

# Number of rows (from the top) the banner occupies. The remaining rows
# (up to row 21) are used for the auto-generated backend list, and row 22
# is always reserved for status messages. Optional, defaults to 10.
banner_rows: 10

# List of backend Viewdata/BBS services offered on the menu. Each page shows
# up to 10 of these, digit-labelled in order; if there are more than fit on
# one page, a "# More options" footer appears and pressing # cycles through
# the remaining pages (wrapping back to the first after the last).
backend_servers:
